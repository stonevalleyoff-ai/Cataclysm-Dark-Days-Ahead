# Fabrique launcher.exe sous Windows à chaque envoi, l'essaie, et le publie dans la
# pré-version « orvane-dernier » :
# https://github.com/stonevalleyoff-ai/Cataclysm-Dark-Days-Ahead/releases/tag/orvane-dernier
#
# Une pré-version n'est pas vue par la mise à jour automatique du lanceur (elle ne lit que la
# dernière vraie version) : publier ici ne pousse rien chez les joueurs.

name: Fabrication du lanceur

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabrication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: launcher.exe (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Le lanceur d'origine est fabriqué avec Python 3.10 ; setup.py a encore besoin de distutils.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          # pylzma n'est importé nulle part et ne s'installe plus sans compilateur : on le laisse.
          Get-Content requirements.txt | Where-Object { $_ -notmatch '^\s*pylzma' } | Set-Content requirements-ci.txt
          pip install -r requirements-ci.txt -r requirements-dev.txt pyinstaller
          pip list

      - name: Essayer Orvane depuis le code (mode essai, rien n'est envoyé)
        run: python tests/orvane_essai.py

      # Le lanceur tout entier, depuis le code : ses erreurs s'y lisent en clair.
      - name: Démarrer le lanceur depuis le code, sans écran
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $dossier = Join-Path $env:LOCALAPPDATA 'CDDA Game Launcher'
          Remove-Item -Recurse -Force $dossier -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath python -ArgumentList '-m', 'cddagl' -PassThru -RedirectStandardOutput sortie.txt -RedirectStandardError erreurs.txt
          Start-Sleep -Seconds 40
          $arrete = $p.HasExited
          if (-not $arrete) { Stop-Process -Id $p.Id -Force }
          Start-Sleep -Seconds 2
          Write-Host '--- sortie et erreurs'; Get-Content sortie.txt, erreurs.txt -ErrorAction SilentlyContinue
          $journal = Join-Path $dossier 'app.log'
          if (-not (Test-Path $journal)) { Write-Error "pas de journal : le lanceur n'a pas démarré"; exit 1 }
          Write-Host '--- journal'; Get-Content $journal
          if (Select-String -Path $journal -Pattern 'Global error' -Quiet) { Write-Error "le lanceur a rencontré une erreur"; exit 1 }
          if ($arrete) { Write-Error "le lanceur s'est arrêté tout seul (code $($p.ExitCode))"; exit 1 }
          Write-Host "Le lanceur a démarré depuis le code et tournait encore après 40 secondes."

      - name: Fabriquer launcher.exe
        run: |
          python setup.py freeze
          if (-not (Test-Path dist/launcher.exe)) { Write-Error "launcher.exe n'a pas été fabriqué"; exit 1 }
          Get-Item dist/launcher.exe | Format-List Name, Length
          Write-Host '--- modules manquants qui comptent'
          Select-String -Path build/launcher/warn-launcher.txt -Pattern "missing module named '?(zstandard|PySide6|shiboken6|sqlalchemy|alembic|arrow|markdown2|rarfile|babel|werkzeug|requests|win32|pywintypes|winutils|cddagl)" | ForEach-Object { $_.Line.Substring(0, [Math]::Min(300, $_.Line.Length)) }

      - name: Démarrer launcher.exe sans écran
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $dossier = Join-Path $env:LOCALAPPDATA 'CDDA Game Launcher'
          Remove-Item -Recurse -Force $dossier -ErrorAction SilentlyContinue
          $journal = Join-Path $dossier 'app.log'
          $p = Start-Process -FilePath dist/launcher.exe -PassThru
          # Un exécutable PyInstaller « en un fichier » se décompresse d'abord : cela peut prendre du temps.
          for ($i = 0; $i -lt 24 -and -not (Test-Path $journal) -and -not $p.HasExited; $i++) { Start-Sleep -Seconds 5 }
          Start-Sleep -Seconds 20
          Write-Host '--- fenêtres ouvertes'
          Get-Process | Where-Object { $_.MainWindowTitle } | Format-Table Id, ProcessName, MainWindowTitle -AutoSize | Out-String -Width 300 | Write-Host
          $arrete = $p.HasExited
          Get-Process launcher -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path $journal)) { Write-Error "pas de journal : le lanceur n'a pas démarré"; exit 1 }
          Write-Host '--- journal'; Get-Content $journal
          if (Select-String -Path $journal -Pattern 'Global error' -Quiet) { Write-Error "le lanceur a rencontré une erreur au démarrage"; exit 1 }
          if ($arrete) { Write-Error "le lanceur s'est arrêté tout seul (code $($p.ExitCode))"; exit 1 }
          Write-Host "Le lanceur a démarré et tournait encore."

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-orvane
          path: dist/launcher.exe

      - name: Publier dans la pré-version « orvane-dernier »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete orvane-dernier --yes --cleanup-tag 2>$null
          $notes = "Le lanceur Kitten avec Orvane (onglet des réglages, section « Orvane »), fabriqué automatiquement depuis la branche $env:GITHUB_REF_NAME, commit $env:GITHUB_SHA. Version d'essai : cochez le mode essai pour vos premières parties."
          gh release create orvane-dernier dist/launcher.exe --prerelease --target $env:GITHUB_SHA --title "Lanceur avec Orvane (dernière fabrication)" --notes $notes
